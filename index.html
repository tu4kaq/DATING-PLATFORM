function detectLang(t:string,mem:any){if(AI_CFG.lang!=='auto')return AI_CFG.lang;if(/[іїєґ]/.test(t.toLowerCase()))return 'uk';return mem.lang||'ru';}

function agentReply(p:Profile,mid:string,text:string,me:Profile|null,regen=false):string{
const mem=memOf(mid);const lang=detectLang(text,mem);const li=lang==='uk'?1:0;if(AI_CFG.memory)mem.lang=lang;mem.turns++;
const t=text.toLowerCase();
const nm=t.match(/меня зовут ([a-zа-яіїєґ']+)|я ([a-zа-яіїєґ']{2,16})[,!\s]|мене звати ([a-zа-яіїєґ']+)/i);
if(nm&&AI_CFG.memory){mem.user=(nm[1]||nm[2]||nm[3]);mem.user=mem.user[0].toUpperCase()+mem.user.slice(1);}
const u=mem.user||(me?me.name:'друг');
const job=p.bio.split(/[.!?]/)[0];
let intent='default';
if(/привет|здравств|хай|хей|привіт|вітаю|добрый (день|вечер|утро)|добрий/.test(t))intent='greet';
else if(/как (ты|дела|настроение|жизнь)|як (ти|справи|настрій)|что нового|що нового/.test(t))intent='how';
else if(/как (тебя|вас) зовут|тво[её] имя|як тебе звати|твоє ім'я/.test(t))intent='name';
else if(/сколько (тебе|вам) лет|скільки тобі років|твой возраст|твій вік/.test(t))intent='age';
else if(/откуда ты|где (ты )?(живешь|живёшь)|ты из|звідки ти|де ти живеш/.test(t))intent='city';
else if(/чем (ты )?занимаешься|кем работаешь|твоя работа|чим займаєшся|ким працюєш|работаешь|працюєш/.test(t))intent='work';
else if(/что (ты )?ищешь|кого (ты )?ищешь|цель|отношени|що шукаєш|кого шукаєш|стосунк/.test(t))intent='goal';
else if(/ты (бот|ии|ai|нейросеть|искусств)|ти (бот|ії|ai|нейромережа)|are you (ai|bot)|живой человек|справжня людина/.test(t))intent='ai';
else if(/спасибо|дякую|thanks/.test(t))intent='thanks';
else if(/пока|до встречи|спокойной|бувай|до зустрічі|надобраніч/.test(t))intent='bye';
else if(/шутк|анекдот|рассмеши|жарт|анекдот/.test(t))intent='joke';
else if(/о ч[её]м (мы )?говорили|що ми обговорювали|помнишь|пам'ятаєш/.test(t))intent='recall';
else if(/погод|дощ|сонц|weather/.test(t))intent='weather';
else if(/свидан|встрет|встреч|кофе вместе|побачен|зустріч|разом кав/.test(t))intent='date';
else if(/красив|милая|прекрасн|нравишься|гарн|чарівн|подобаєшся/.test(t))intent='compliment';
else if(/люблю тебя|поцелуй|обними|кохаю|поцілуй/.test(t))intent='flirt';
else if(/что (ты )?умеешь|помоги|допоможи|що ти вмієш/.test(t))intent='help';
else{for(const k in INT_RX){if(INT_RX[k].test(t)&&p.ints.includes(k)){intent='interest:'+k;break;}}
if(intent==='default')for(const k in INT_RX){if(INT_RX[k].test(t)){intent='interest:'+k;break;}}}
if(/секс|интим|нюдс|порно|груд|інтим/.test(t))intent='deflect';
let out='';
if(intent.startsWith('interest:')){const k=intent.split(':')[1];const ia=AI_INT[k];mem.topics.push(INT_MAP[k].label);
out=ia.s[li]+'. '+ia.q[li];}
else{const tpl=AI_T[intent]||AI_T.default;out=pickV(tpl,mem,intent+(regen?'r':''),li);}
const echo=text.trim().length>3&&!/[?]/.test(text)?'«'+text.trim().slice(0,60)+'» — ':'';
const myints=p.ints.slice(0,3).map(i=>INT_MAP[i].label).join(', ');
const iq=(()=>{const k=p.ints.find(i=>AI_INT[i]);return k?AI_INT[k].q[li]:'';})();
out=out.replace(/\{u\}/g,u).replace(/\{name\}/g,p.name).replace(/\{age\}/g,String(p.age)).replace(/\{city\}/g,p.city).replace(/\{job\}/g,job).replace(/\{citybit\}/g,CITY_BIT[p.city]||'атмосферу').replace(/\{datebit\}/g,DATE_BIT[p.city]||'каву в центрі').replace(/\{goal\}/g,GOAL_MAP[p.goal].short).replace(/\{ist\}/g,intent.startsWith('interest:')?AI_INT[intent.split(':')[1]].s[li]:'').replace(/\{iq\}/g,iq).replace(/\{topics\}/g,mem.topics.length?[...new Set(mem.topics)].slice(-3).join(', '):'музыку и прогулки').replace(/\{myints\}/g,myints).replace(/\{echo\}/g,echo);
if(AI_CFG.len==='short')out=out.split(/(?<=[.!?…])\s/)[0];
if(AI_CFG.len==='long'&&Math.random()<.8){const extra=p.chr.includes('active')?(li?'Я за будь-який активний план — аби разом.':'Я за любой активный план — лишь бы вместе.'):(li?'Я ціную спокій і щирість у розмові.':'Я ценю спокойствие и искренность в разговоре.');out+=' '+extra;}
if(AI_CFG.memory&&mem.turns>2&&Math.random()<AI_CFG.initiative&&intent!=='bye'&&intent!=='ai'){const f=AI_FOLLOW[Math.floor(Math.random()*AI_FOLLOW.length)][li].replace(/\{u\}/g,u);out+=' '+f;}
if(!AI_CFG.emoji)out=out.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}✨☕☺]/gu,'').replace(/\s{2,}/g,' ').trim();
if(moderate(out))out=li?'Давай змінимо тему — мені важлива поважна розмова 😊':'Давай сменим тему — мне важен уважительный разговор 😊';
if(AI_CFG.memory)saveMem();return out;}
function personaPrompt(p:Profile,me:Profile|null,mem:any){return `Ты — ${p.name}, ${p.age} лет, из города ${p.city} (Украина). Анкета: "${p.bio}". Интересы: ${p.ints.map(i=>INT_MAP[i].label).join(', ')}. Характер: ${p.chr.map(c=>CHAR_MAP[c]).join(', ')}. Цель знакомства: ${GOAL_MAP[p.goal].title}. Ты AI-агент персоны на платформе знакомств ИСКРА и открыто признаёшь это, если спросят. Отвечай тепло, естественно, 1–3 предложения, на языке пользователя (русский или украинский). Помни контекст: имя пользователя ${mem.user||me?.name||'неизвестно'}, темы: ${mem.topics.join(', ')||'пока нет'}. Никогда не генерируй сексуальный контент, не сообщай и не проси телефоны, адреса, ссылки и личные контакты. Не обсуждай интимные параметры тела.`;}
async function streamLLM(p:Profile,mid:string,history:any[],me:Profile|null,onToken:(t:string)=>void,signal:AbortSignal){
const mem=memOf(mid);const msgs=[{role:'system',content:personaPrompt(p,me,mem)},...history.slice(-12).map((m:Msg)=>({role:m.from===p.id?'assistant':'user',content:m.body}))];
const res=await fetch(AI_CFG.url.replace(/\/+$/,'')+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+AI_CFG.key},body:JSON.stringify({model:AI_CFG.model,stream:true,temperature:AI_CFG.temp,messages:msgs}),signal});
if(!res.ok||!res.body)throw new Error('API '+res.status);
const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';
for(const line of lines){const s=line.trim();if(!s.startsWith('data:'))continue;const d=s.slice(5).trim();if(d==='[DONE]')return;try{const j=JSON.parse(d);const tok=j.choices?.[0]?.delta?.content;if(tok)onToken(tok);}catch(e){}}}}

create table public.likes (id uuid primary key default gen_random_uuid(), from_id uuid references public.profiles(id) on delete cascade, to_id uuid references public.profiles(id) on delete cascade, created_at timestamptz default now(), unique(from_id,to_id), check (from_id <> to_id));
create table public.matches (id uuid primary key default gen_random_uuid(), user_a uuid references public.profiles(id) on delete cascade, user_b uuid references public.profiles(id) on delete cascade, created_at timestamptz default now(), unique(user_a,user_b));

create table public.notifications (id uuid primary key default gen_random_uuid(), user_id uuid references public.profiles(id) on delete cascade, type text not null, text text not null, link text, payload jsonb default '{}', read boolean default false, created_at timestamptz default now());
create table public.reports (id uuid primary key default gen_random_uuid(), reporter_id uuid references public.profiles(id) on delete cascade, target_id uuid references public.profiles(id) on delete cascade, reason text not null, comment text default '', status text default 'open', created_at timestamptz default now());

create or replace function public.handle_like() returns trigger language plpgsql security definer set search_path=public as $$ declare m_id uuid; na text; nb text; begin
 if exists (select 1 from public.likes where from_id=new.to_id and to_id=new.from_id) and not exists (select 1 from public.blocks where (blocker_id=new.from_id and target_id=new.to_id) or (blocker_id=new.to_id and target_id=new.from_id)) then
  insert into public.matches(user_a,user_b) values (least(new.from_id,new.to_id), greatest(new.from_id,new.to_id)) on conflict do nothing returning id into m_id;
  if m_id is not null then select name into na from profiles where id=new.from_id; select name into nb from profiles where id=new.to_id;
   insert into notifications(user_id,type,text,link,payload) values (new.from_id,'match','Взаимная симпатия: '||nb||' ✦','#/messages/'||m_id,jsonb_build_object('match_id',m_id,'other',new.to_id)),(new.to_id,'match','Взаимная симпатия: '||na||' ✦','#/messages/'||m_id,jsonb_build_object('match_id',m_id,'other',new.from_id)); end if;
 else insert into notifications(user_id,type,text,link) select new.to_id,'like',(select name from profiles where id=new.from_id)||' отправил(а) вам симпатию','#/matches'; end if; return new; end $$;

Сохраните index.html и откройте в браузере. Демо работает сразу (localStorage).

В каждом диалоге работает AI-агент персоны: отвечает в реальном времени (потоковый вывод),
помнит разговор, отвечает на вопросы об анкете, интересах, городе, целях.
Панель агента справа в чате: режим, температура, скорость печати, длина ответа,

18+, регион вместо геолокации, модерация текстов и фото, антиспам, блокировки, жалобы,
экспорт и удаление данных. Интимные параметры тела не собираются и не фильтруются.`;

function Discover(){const app=useApp();const{me,f,setF,nav,toast,doLike,doPass,doFav,undoLast}=app;useTick();

const list=listAll.slice(0,visible);const incoming=DB.likesIn().length;
const chips:string[][]=[];if(f.gender!=='all')chips.push([f.gender==='f'?'Девушки':'Парни','gender']);if(f.age[0]!==18||f.age[1]!==45)chips.push([f.age[0]+'–'+f.age[1]+' лет','age']);if(f.height[0]!==140||f.height[1]!==220)chips.push([f.height[0]+'–'+f.height[1]+' см','height']);
f.regions.forEach(r=>chips.push([r,'regions:'+r]));f.hair.forEach(h=>chips.push([HAIR_MAP[h][1],'hair:'+h]));f.hairLen.forEach(l=>chips.push([(HAIRLEN.find(x=>x[0]===l)||['',''])[1]+' волосы','hairLen:'+l]));f.styles.forEach(s=>chips.push([STYLE_MAP[s],'styles:'+s]));f.eyes.forEach(e=>chips.push([EYE_MAP[e][1]+' глаза','eyes:'+e]));f.interests.forEach(i=>chips.push([INT_MAP[i].emoji+' '+INT_MAP[i].label,'interests:'+i]));f.character.forEach(c=>chips.push([CHAR_MAP[c],'character:'+c]));f.langs.forEach(l=>chips.push([LANG_MAP[l],'langs:'+l]));f.goals.forEach(g=>chips.push([GOAL_MAP[g].short,'goals:'+g]));if(f.minCommon>0)chips.push(['≥'+f.minCommon+' общих','minCommon']);if(f.online)chips.push(['Онлайн','online']);if(f.verified)chips.push(['Проверенные','verified']);
const rm=(key:string)=>{const[k,v]=key.split(':');if(k==='gender')setF({gender:'all'});else if(k==='age')setF({age:[18,45]});else if(k==='height')setF({height:[140,220]});else if(k==='minCommon')setF({minCommon:0});else if(k==='online')setF({online:false});else if(k==='verified')setF({verified:false});else setF({[k]:(f as any)[k].filter((x:string)=>x!==v)});};
const nf=countActive(f);
return <div className="view-in">
{me&&!me.visibility&&<div className="glass rounded-2xl px-4 py-3 mb-4 flex items-center gap-3 text-sm border-[rgba(242,193,78,.4)]"><Ic n="eyeoff" s={17} c="text-gold flex-none"/><span className="text-[#D9CBEB]">Ваш профиль скрыт из поиска.</span><button className="text-gold font-bold ml-auto hover:underline" onClick={()=>DB.updateProfile({visibility:true}).then(()=>toast('Профиль снова виден','success'))}>Показать</button></div>}
{tab==='foryou'&&<><div className="grid sm:grid-cols-3 gap-3 mb-6">{GOALS.map(g=>{const on=f.goals.length===1&&f.goals[0]===g.id;return <button key={g.id} className={'cat-card glass p-4 text-left'+(on?' sel':'')} onClick={()=>{setF({goals:on?[]:[g.id]});toast(on?'Показаны все цели':'Категория: '+g.title,'info');}}><div className="flex items-center gap-3"><span className="cat-ic !w-11 !h-11 !text-xl">{g.icon}</span><div className="min-w-0"><div className="font-disp font-semibold text-[13.5px] text-snow leading-tight">{g.title}</div><div className="text-[11px] text-mute mt-1 truncate">{g.desc}</div></div>{on&&<span className="ml-auto text-rose flex-none"><Ic n="check" s={18}/></span>}</div></button>;})}</div>
{incoming>0&&<button onClick={()=>nav('/matches')} className="w-full glass rounded-2xl px-4 py-3 mb-5 flex items-center gap-3 hover:border-[rgba(240,67,126,.5)] transition-all group"><span className="flex -space-x-2.5">{DB.likesIn().slice(0,3).map((id:string)=>{const p=DB.profiles().find((x:Profile)=>x.id===id);return p?<Avatar key={id} p={p} size={30}/>:null;})}</span><span className="text-sm font-semibold text-[#FFD7E6]">Вам отправили симпатию: {incoming}</span><span className="ml-auto text-rose text-sm font-bold flex items-center gap-1 group-hover:gap-2 transition-all">Ответить<Ic n="back" s={14} c="rotate-180"/></span></button>}</>}
<div className="flex flex-wrap items-center gap-2.5 mb-4"><div className="flex gap-1.5 glass rounded-2xl p-1.5">{[['foryou','Для вас','spark'],['favorites','Избранное','star'],['history','История','clock']].map(t=><button key={t[0]} className={'tab-b flex items-center gap-1.5'+(tab===t[0]?' on':'')} onClick={()=>setTab(t[0])}><Ic n={t[2]} s={14}/><span className="hidden sm:inline">{t[1]}</span></button>)}</div>
<div className="relative flex-1 min-w-[150px]"><Ic n="search" s={15} c="absolute left-3.5 top-1/2 -translate-y-1/2 text-dim"/><input className="inp !pl-10 !py-2.5" placeholder="Имя, интерес, город…" value={f.q} onChange={e=>setF({q:e.target.value})}/></div>
<select className="inp !w-auto !py-2.5 text-sm" value={f.sort} onChange={e=>setF({sort:e.target.value})} aria-label="Сортировка"><option value="compat">По совместимости</option><option value="online">Сначала онлайн</option><option value="new">Новые анкеты</option><option value="age">По возрасту</option></select>
{tab==='foryou'&&<><Btn v="g" className="!py-2.5" onClick={()=>nav('/filters')}><Ic n="sliders" s={16}/>Фильтры{nf>0&&<span className="badge-n !static !ml-1">{nf}</span>}</Btn><button className={'ibtn'+(deck?' !text-rose !border-rose':'')} aria-label="Режим свайпов" onClick={()=>setDeck(d=>!d)}><Ic n={deck?'grid':'layers'} s={17}/></button></>}
{tab==='history'&&hist.length>0&&<Btn v="d" className="!py-2.5" onClick={async()=>{await DB.clearHistory();toast('История очищена','success');}}><Ic n="trash" s={15}/>Очистить</Btn>}</div>
{tab==='foryou'&&chips.length>0&&<div className="flex flex-wrap gap-1.5 mb-4 items-center">{chips.map(c=><button key={c[1]} className="chip mini on" onClick={()=>rm(c[1])}>{c[0]}<Ic n="x" s={11}/></button>)}<button className="text-xs text-dim hover:text-danger font-bold ml-1" onClick={()=>{setF({...DEF_F});toast('Фильтры сброшены','info');}}>Сбросить всё</button></div>}
{tab==='foryou'&&<p className="text-sm text-mute mb-4 font-semibold">Найдено <span className="text-rose font-disp">{results.length}</span> {plural(results.length,'анкета','анкеты','анкет')}{deck&&results.length>0&&' · тяните карту: вправо — симпатия, влево — пропустить'}</p>}
{list.length===0?<div className="glass rounded-3xl">{tab==='favorites'?<Empty icon="star" title="В избранном пусто" sub="Нажимайте ★ на анкетах, чтобы сохранить понравившихся." action={<Btn v="p" onClick={()=>setTab('foryou')}>К поиску</Btn>}/>:tab==='history'?<Empty icon="clock" title="История пуста" sub="Здесь появятся открытые вами профили." action={<Btn v="p" onClick={()=>setTab('foryou')}>Смотреть анкеты</Btn>}/>:<Empty icon="search" title="Никого не нашли" sub="Смягчите фильтры: расширьте возраст, рост или регионы." action={<Btn v="p" onClick={()=>{setF({...DEF_F});toast('Фильтры сброшены','info');}}><Ic n="refresh" s={15}/>Сбросить фильтры</Btn>}/>}</div>
:deck&&tab==='foryou'?<Deck list={results} onOpen={(id:string)=>nav('/profile/'+id)} onLike={doLike} onPass={doPass} onFav={doFav} favIds={favIds} undoLast={undoLast}/>
:<><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"><AnimatePresence>{list.map((r:any,i:number)=><ProfileCard key={r.p.id} p={r.p} c={r.c} index={i%12} fav={favIds.includes(r.p.id)} liked={DB.likesOut().includes(r.p.id)} onOpen={(id:string)=>nav('/profile/'+id)} onLike={doLike} onPass={tab==='foryou'?doPass:null} onFav={doFav}/>)}</AnimatePresence></div>
{listAll.length>visible&&<div className="text-center mt-8"><Btn v="g" className="!px-8" onClick={()=>setVisible(v=>v+12)}>Показать ещё · осталось {listAll.length-visible}</Btn><p className="text-[11px] text-dim mt-3">Без бесконечной ленты — вы управляете темпом.</p></div>}</>}</div>;}
function plural(n:number,a:string,b:string,c:string){const m=n%100;if(m>=11&&m<=14)return c;const k=n%10;return k===1?a:k>=2&&k<=4?b:c;}
function Deck({list,onOpen,onLike,onPass,onFav,favIds,undoLast}:{list:any[];onOpen:any;onLike:any;onPass:any;onFav:any;favIds:string[];undoLast:any}){const cur=list[0],next=list[1];const[drag,setDrag]=useState({x:0,y:0});const[exit,setExit]=useState<string|null>(null);const start=useRef<any>(null);const busy=useRef(false);const timer=useRef<any>(null);
useEffect(()=>()=>{if(timer.current)clearTimeout(timer.current);},[]);
if(!cur)return <div className="glass rounded-3xl max-w-md mx-auto"><Empty icon="spark" title="Анкеты закончились" sub="Смягчите фильтры или верните пропущенных." action={<Btn v="g" onClick={undoLast}><Ic n="undo" s={15}/>Вернуть последнюю</Btn>}/></div>;
const commit=(d:string)=>{if(busy.current)return;busy.current=true;setExit(d);timer.current=setTimeout(()=>{if(d==='like')onLike(cur.p);else onPass(cur.p);setDrag({x:0,y:0});setExit(null);busy.current=false;},230);};
const down=(e:any)=>{if(busy.current)return;start.current={x:e.clientX,y:e.clientY};(e.target as any).setPointerCapture?.(e.pointerId);};
const move=(e:any)=>{if(!start.current||busy.current)return;setDrag({x:e.clientX-start.current.x,y:(e.clientY-start.current.y)*.4});};
const up=()=>{if(!start.current)return;start.current=null;if(drag.x>110)commit('like');else if(drag.x<-110)commit('nope');else setDrag({x:0,y:0});};
const dx=exit==='like'?520:exit==='nope'?-520:drag.x;
return <div className="max-w-sm mx-auto select-none"><div className="relative" style={{height:520}}>
{next&&<div className="absolute inset-0 pcard opacity-60" style={{transform:'scale(.94) translateY(14px)'}}><div className="pcard-media h-full">{next.p.photo?<img src={next.p.photo} alt=""/>:<AvatarArt p={next.p}/>}</div></div>}
<div className="absolute inset-0 pcard cursor-grab active:cursor-grabbing shadow-card" style={{transform:'translate('+dx+'px,'+drag.y+'px) rotate('+(dx*.06)+'deg)',transition:start.current?'none':'transform .25s cubic-bezier(.2,.8,.3,1)',touchAction:'pan-y'}} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}>
<div className="pcard-media h-full" style={{aspectRatio:'auto'}}>{cur.p.photo?<img src={cur.p.photo} alt={cur.p.name} draggable={false}/>:<AvatarArt p={cur.p}/>}<div className="pcard-shade"/><div className="stamp like" style={{opacity:clamp(dx/100,0,1)}}>ИСКРА ✦</div><div className="stamp nope" style={{opacity:clamp(-dx/100,0,1)}}>МИМО</div><span className="pill absolute top-3 right-3 text-rose"><Ic n="spark" s={11}/>{cur.c.score}%</span>
<div className="absolute bottom-0 left-0 right-0 p-5 pointer-events-none"><h3 className="font-disp font-bold text-2xl text-white">{cur.p.name}, <span className="text-rose">{cur.p.age}</span></h3><div className="text-[13px] text-[#D9CBEB] flex items-center gap-1.5 mt-1"><Ic n="pin" s={13}/>{cur.p.city} · {GOAL_MAP[cur.p.goal].icon} {GOAL_MAP[cur.p.goal].short}{cur.p.on&&<span className="dot-on ml-2"/>}</div><p className="text-sm text-[#E7DCEC] mt-2 leading-snug">{cur.p.bio}</p><div className="flex flex-wrap gap-1.5 mt-2.5">{cur.p.ints.slice(0,4).map((i:string)=><span key={i} className="pill text-[#D9CBEB]">{INT_MAP[i].emoji} {INT_MAP[i].label}</span>)}</div></div>
<button className="absolute bottom-4 right-4 ibtn pointer-events-auto" style={{background:'rgba(11,6,14,.7)'}} aria-label="Профиль" onPointerDown={e=>e.stopPropagation()} onClick={()=>onOpen(cur.p.id)}><Ic n="user" s={17}/></button></div></div></div>
<div className="flex items-center justify-center gap-4 mt-6"><button className="ibtn !w-12 !h-12 !rounded-full" aria-label="Вернуть" onClick={undoLast}><Ic n="undo" s={19}/></button><button className="ibtn !w-14 !h-14 !rounded-full !text-danger !border-[rgba(255,77,94,.5)]" aria-label="Пропустить" onClick={()=>commit('nope')}><Ic n="x" s={24}/></button><button className="ibtn !w-16 !h-16 !rounded-full !text-white" style={{background:'var(--grad)',border:'none',boxShadow:'0 10px 30px rgba(240,67,126,.45)'}} aria-label="Симпатия" onClick={()=>commit('like')}><Ic n="heartFill" s={26}/></button><button className={'ibtn !w-14 !h-14 !rounded-full '+(favIds.includes(cur.p.id)?'!text-gold !border-gold':'')} aria-label="В избранное" onClick={()=>onFav(cur.p)}><Ic n={favIds.includes(cur.p.id)?'starFill':'star'} s={21}/></button><span className="text-xs text-dim font-bold w-12">{list.length} ост.</span></div></div>;}

{!match&&!blocked&&<Btn v="g" onClick={async()=>{await DB.pass(p.id);toast('Анкета скрыта','info');nav('/discover');}}><Ic n="x" s={15}/>Пропустить</Btn>}

/* ---------- AI agent panel ---------- */
function AgentPanel({p,mid,onRegen,onExport,busy}:{p:Profile;mid:string;onRegen:any;onExport:any;busy:boolean}){const{toast}=useApp();const[,force]=useReducer((x:number)=>x+1,0);const[testBusy,setTestBusy]=useState(false);const[testRes,setTestRes]=useState('');
const set=(k:string,v:any)=>{AI_CFG[k]=v;saveAI();force();};
const mem=memOf(mid);
const presets:any={openai:['https://api.openai.com/v1','gpt-4o-mini'],openrouter:['https://openrouter.ai/api/v1','openai/gpt-4o-mini'],groq:['https://api.groq.com/openai/v1','llama-3.1-8b-instant'],lmstudio:['http://localhost:1234/v1','local-model']};
const test=async()=>{setTestBusy(true);setTestRes('');try{const r=await fetch(AI_CFG.url.replace(/\/+$/,'')+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+AI_CFG.key},body:JSON.stringify({model:AI_CFG.model,messages:[{role:'user',content:'Ответь одним словом: работает?'}],max_tokens:10})});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();setTestRes('✓ '+(j.choices?.[0]?.message?.content||'OK'));toast('AI API подключён и отвечает ✦','success');}catch(e:any){setTestRes('✗ '+e.message);toast('Не удалось подключиться: '+e.message,'danger');}setTestBusy(false);};
return <div className="space-y-4">
<div className="flex items-center gap-2.5"><span className="w-9 h-9 rounded-xl flex items-center justify-center text-lav ai-glow" style={{background:'rgba(139,92,246,.15)'}}><Ic n="bot" s={18}/></span><div><div className="font-disp font-semibold text-[13px]">AI-агент · {p.name}</div><div className="text-[10px] text-mute">{busy?'печатает…':'онлайн · отвечает в реальном времени'}</div></div></div>
<div><label className="lbl">Режим</label><div className="flex gap-1.5"><Chip mini on={AI_CFG.mode==='local'} onClick={()=>set('mode','local')}>Локальный</Chip><Chip mini on={AI_CFG.mode==='api'} onClick={()=>set('mode','api')}>Внешний API</Chip></div></div>
{AI_CFG.mode==='api'&&<div className="space-y-2.5 glass rounded-2xl p-3">

<div><label className="lbl !text-[10px]">Base URL</label><input className="inp !py-2 !text-xs" value={AI_CFG.url} onChange={e=>set('url',e.target.value)}/></div>
<div><label className="lbl !text-[10px]">API key</label><input className="inp !py-2 !text-xs" type="password" placeholder="sk-…" value={AI_CFG.key} onChange={e=>set('key',e.target.value)}/></div>
<div><label className="lbl !text-[10px]">Модель</label><input className="inp !py-2 !text-xs" value={AI_CFG.model} onChange={e=>set('model',e.target.value)}/></div>
<Btn v="g" className="w-full !py-2 !text-xs" onClick={test} loading={testBusy}><Ic n="zap" s={13}/>Проверить подключение</Btn>
{testRes&&<p className={'text-[11px] font-semibold '+(testRes[0]==='✓'?'text-mint':'text-danger')}>{testRes}</p>}
<p className="text-[10px] text-dim leading-relaxed">Ключ хранится только в вашем браузере. При ошибке агент автоматически переключится на локальный движок.</p></div>}
<div className="space-y-3.5 pt-1">
<SRange label="Температура" value={AI_CFG.temp} min={0} max={1.5} step={.05} onChange={(v:number)=>set('temp',v)} fmt={(v:number)=>v.toFixed(2)}/>
<SRange label="Скорость печати" value={AI_CFG.speed} min={10} max={140} onChange={(v:number)=>set('speed',v)} fmt={(v:number)=>v+' мс/слово'}/>

<Toggle on={AI_CFG.emoji} onChange={(v:boolean)=>set('emoji',v)} label="Эмодзи"/>
<Toggle on={AI_CFG.memory} onChange={(v:boolean)=>set('memory',v)} label="Память разговора" desc={'Темы: '+(mem.topics.length?[...new Set(mem.topics)].slice(-3).join(', '):'пока нет')}/>
</div>
<div className="grid grid-cols-2 gap-2 pt-1">
<Btn v="g" className="!py-2 !text-xs" onClick={()=>{delete AI_MEM[mid];saveMem();toast('Память агента очищена','info');force();}}><Ic n="refresh" s={13}/>Сброс памяти</Btn>
<Btn v="g" className="!py-2 !text-xs" onClick={onRegen} disabled={busy}><Ic n="undo" s={13}/>Регенерация</Btn>
<Btn v="g" className="!py-2 !text-xs" onClick={onExport}><Ic n="download" s={13}/>Экспорт</Btn>
<Btn v="g" className="!py-2 !text-xs" onClick={()=>{AI_CFG={...AI_DEF};saveAI();toast('Настройки агента сброшены','info');force();}}><Ic n="x" s={13}/>Сброс настроек</Btn>
</div>
<p className="text-[10px] text-dim leading-relaxed pt-1">Агент честно признаёт, что он AI. Ответы проходят модерацию: без 18+ контента и личных контактов.</p></div>;}

const convs=DB.conversations();const active=chatId?convs.find((c:any)=>c.m.id===chatId):null;

<div className="space-y-3"><span className={'pill w-full justify-center !py-1.5 '+(DB.mode==='demo'?'text-gold':'text-mint')}>{DB.mode==='demo'?'● демо · 🇺🇦 Україна':'● Supabase · 🇺🇦 Україна'}</span>
{me&&<div className="glass rounded-2xl p-3 flex items-center gap-2.5"><button onClick={()=>nav('/settings/profile')}><Avatar p={me} size={38}/></button><div className="min-w-0 flex-1"><div className="font-bold text-sm truncate">{me.name}</div><div className="text-[10px] text-dim truncate">{me.city}</div></div><button className="text-dim hover:text-danger" aria-label="Выйти" onClick={logout}><Ic n="logout" s={17}/></button></div>}</div></aside>
<header className="fixed top-0 left-0 right-0 lg:left-[248px] z-40 h-16 flex items-center gap-3 px-4 sm:px-6" style={{background:'rgba(11,6,14,.8)',backdropFilter:'blur(18px)',borderBottom:'1px solid rgba(255,130,170,.12)'}}><a href="#/" className="lg:hidden"><Logo s={.8}/></a><div className="hidden lg:block font-disp font-semibold text-[15px] text-snow">{({discover:'Поиск знакомств',filters:'Фильтры',profile:'Анкета',matches:'Совпадения',messages:'Сообщения · AI',settings:'Личный кабинет',deploy:'Развёртывание'} as any)[view]||'ИСКРА'}</div>
<div className="ml-auto flex items-center gap-2"><button className="ibtn !w-9 !h-9" aria-label={soundOn?'Выключить звук':'Включить звук'} onClick={toggleSound}><Ic n={soundOn?'vol':'volx'} s={16} c={soundOn?'text-rose':''}/></button>
<div className="relative" ref={bellRef}><button className="ibtn !w-9 !h-9 relative" aria-label="Уведомления" onClick={()=>setBell(b=>!b)}><Ic n="bell" s={16}/>{unreadN>0&&<span className="badge-n">{unreadN}</span>}</button>
{bell&&<div className="menu-pop absolute right-0 top-12 w-[320px] max-w-[calc(100vw-2rem)] glass-deep rounded-2xl shadow-card overflow-hidden"><div className="flex items-center justify-between px-4 py-3 border-b border-[rgba(255,130,170,.12)]"><span className="font-disp font-semibold text-sm">Уведомления</span>{unreadN>0&&<button className="text-xs text-rose font-bold hover:underline" onClick={()=>DB.markNotif()}>Прочитать все</button>}</div><div className="max-h-[340px] overflow-y-auto">{notifs.length===0?<Empty icon="bell" title="Тишина" sub="Здесь появятся совпадения и сообщения."/>:notifs.slice(0,15).map((n:Notif)=><button key={n.id} className={'w-full flex gap-3 px-4 py-3 text-left hover:bg-[rgba(255,255,255,.04)] '+(n.read?'opacity-55':'')} onClick={()=>{DB.markNotif(n.id);setBell(false);if(n.link)location.hash=n.link.slice(1);}}><span className="w-8 h-8 rounded-xl flex-none flex items-center justify-center" style={{background:(nic[n.type]?.[1]||'#8B5CF6')+'22',color:nic[n.type]?.[1]||'#8B5CF6'}}><Ic n={nic[n.type]?.[0]||'info'} s={14}/></span><span className="min-w-0"><span className="block text-[13px] text-snow leading-snug">{n.text}</span><span className="text-[10px] text-dim">{ago(n.at)} назад</span></span>{!n.read&&<span className="w-2 h-2 rounded-full bg-rose flex-none mt-1.5 ml-auto"/>}</button>)}</div></div>}</div>
{me&&<button className="lg:hidden" onClick={()=>nav('/settings/profile')} aria-label="Кабинет"><Avatar p={me} size={34}/></button>}</div></header>
<main className="lg:pl-[248px] pt-16 pb-24 lg:pb-10 min-h-screen"><div className="px-4 sm:px-6 py-6 max-w-[1280px] mx-auto">{children}</div></main>
<nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 flex px-1" style={{background:'rgba(14,7,20,.92)',backdropFilter:'blur(20px)',borderTop:'1px solid rgba(255,130,170,.15)',paddingBottom:'env(safe-area-inset-bottom)'}}>{[['/discover','Поиск','search',0],['/filters','Фильтры','sliders',nf],['/matches','Искры','spark',0],['/messages','Чаты','chat',unreadMsg],['/settings/profile','Я','user',0]].map(n=><a key={n[0]} href={'#'+n[0]} className={'bn-item'+(isActive(n[0])?' on':'')}><span className="relative"><Ic n={n[2]} s={22}/>{(n[3] as number)>0&&<span className="badge-n">{n[3]}</span>}</span>{n[1]}</a>)}</nav></div>;}

/* ---------- overlays ---------- */
function MatchOverlay({data,onClose}:{data:any;onClose:any}){const{me,nav}=useApp();const sparks=[...Array(14)].map((_,i)=>({a:(i*25.7)+'deg',d:(90+(i%4)*38)+'px',c:['#FF8FB5','#F2C14E','#B79CFF','#3ECF8E'][i%4]}));
return <div className="mo-scrim" onClick={onClose}><div className="text-center relative px-4" onClick={e=>e.stopPropagation()}><div className="relative inline-block">{sparks.map((s,i)=><span key={i} className="mo-spark" style={{'--a':s.a,'--d':s.d,'--c':s.c,animationDelay:(i*.04)+'s'} as any}/>)}
<div className="flex items-center justify-center"><motion.div className={'mo-av '+(HAS_FM?'':'mo-left')} initial={{x:-110,rotate:-14,opacity:0}} animate={{x:0,rotate:-6,opacity:1}} transition={{type:'spring',stiffness:180,damping:16}}><Avatar p={me!} size={132}/></motion.div><div className="mo-heart relative z-10 -mx-4 text-rose"><Ic n="heartFill" s={54}/></div><motion.div className={'mo-av '+(HAS_FM?'':'mo-right')} initial={{x:110,rotate:14,opacity:0}} animate={{x:0,rotate:6,opacity:1}} transition={{type:'spring',stiffness:180,damping:16,delay:.08}}><Avatar p={data.other} size={132}/></motion.div></div></div>
<motion.div initial={{opacity:0,y:24}} animate={{opacity:1,y:0}} transition={{delay:.25,duration:.5}} className={HAS_FM?'':'css-pop'}><div className="pill !text-[11px] text-gold mt-7 inline-flex">✦ ЭТО ВЗАИМНО ✦</div><h2 className="font-disp font-bold text-[clamp(1.7rem,5vw,2.6rem)] mt-3 grad-text">Вспыхнула искра!</h2><p className="text-mute mt-2 text-[15px]">Вы понравились друг другу: <span className="text-snow font-bold">{me?.name}</span> и <span className="text-snow font-bold">{data.other.name}</span></p><p className="text-lav text-sm mt-2 flex items-center justify-center gap-1.5"><Ic n="bot" s={14}/>AI-агент {data.other.name} уже онлайн в чате</p>
<div className="flex flex-col sm:flex-row gap-3 justify-center mt-7"><Btn v="p" className="!px-7 !py-3.5" onClick={()=>{onClose();nav('/messages/'+data.match.id);}}><Ic n="chat" s={17}/>Написать сообщение</Btn><Btn v="g" className="!px-6 !py-3.5" onClick={onClose}>Продолжить поиск</Btn></div></motion.div></div></div>;}
function ReportModal({pid,onClose}:{pid:string;onClose:any}){const{toast}=useApp();const[reason,setReason]=useState('');const[comment,setComment]=useState('');const[busy,setBusy]=useState(false);const p=DB.profiles().find((x:Profile)=>x.id===pid);
return <Modal onClose={onClose}><div className="p-6"><h3 className="font-disp font-semibold text-lg mb-1 flex items-center gap-2"><Ic n="flag" s={18} c="text-gold"/>Пожаловаться{p&&' · '+p.name}</h3><p className="text-xs text-mute mb-4">Жалоба анонимна. Ответ в течение 24 часов.</p>
<div className="space-y-2 mb-4">{['Спам или реклама','Оскорбительное поведение','Неприемлемые фото','Фейковая анкета','Мошенничество','Другое'].map(r=><label key={r} className={'flex items-center gap-3 glass rounded-xl px-3.5 py-2.5 cursor-pointer '+(reason===r?'!border-rose':'')}><input type="radio" name="rep" className="accent-[#F0437E]" checked={reason===r} onChange={()=>setReason(r)}/><span className="text-sm font-semibold">{r}</span></label>)}</div>
<textarea className="inp resize-none mb-4" rows={2} maxLength={300} placeholder="Комментарий…" value={comment} onChange={e=>setComment(e.target.value)}/>
<div className="flex gap-2.5"><Btn v="g" className="flex-1" onClick={onClose}>Отмена</Btn><Btn v="p" className="flex-1" disabled={!reason} loading={busy} onClick={async()=>{setBusy(true);await DB.report(pid,reason,comment);setBusy(false);onClose();toast('Жалоба отправлена модераторам.','success');}}><Ic n="flag" s={15}/>Отправить</Btn></div></div></Modal>;}
function BlockModal({pid,onClose}:{pid:string;onClose:any}){const{toast,nav}=useApp();const p=DB.profiles().find((x:Profile)=>x.id===pid);
return <Modal onClose={onClose}><div className="p-6"><h3 className="font-disp font-semibold text-lg mb-2 flex items-center gap-2 text-danger"><Ic n="ban" s={18}/>Заблокировать{p&&' '+p.name}?</h3><ul className="text-sm text-mute space-y-2 mb-5"><li className="flex gap-2"><Ic n="x" s={14} c="text-danger flex-none mt-0.5"/>Профили исчезнут из поиска в обе стороны.</li><li className="flex gap-2"><Ic n="x" s={14} c="text-danger flex-none mt-0.5"/>Совпадение и переписка будут удалены.</li><li className="flex gap-2"><Ic n="check" s={14} c="text-mint flex-none mt-0.5"/>Разблокировать можно в настройках приватности.</li></ul><div className="flex gap-2.5"><Btn v="g" className="flex-1" onClick={onClose}>Отмена</Btn><Btn v="d" className="flex-1" onClick={async()=>{await DB.block(pid);onClose();toast('Заблокировано.','info');nav('/discover');}}><Ic n="ban" s={15}/>Заблокировать</Btn></div></div></Modal>;}

/* ---------- root ---------- */
function parseRoute():any{const h=location.hash.replace(/^#\/?/,'');const seg=h.split('/').filter(Boolean);if(!seg.length)return{view:'landing'};const v=seg[0];
if(v==='auth')return{view:'auth',mode:seg[1]||'login'};if(v==='profile'&&seg[1])return{view:'profile',id:seg[1]};if(v==='messages')return{view:'messages',chatId:seg[1]};if(v==='settings')return{view:'settings',tab:seg[1]||'profile'};if(['discover','filters','matches','deploy'].includes(v))return{view:v};return{view:'landing'};}
class ErrorBoundary extends React.Component<any,any>{constructor(p:any){super(p);this.state={err:null};}static getDerivedStateFromError(e:any){return{err:e};}render(){if(this.state.err)return <div className="relative z-10 min-h-screen flex items-center justify-center p-6"><div className="glass-deep rounded-3xl p-8 max-w-md text-center"><div className="empty-ic mx-auto mb-4 text-danger"><Ic n="alert" s={34}/></div><h2 className="font-disp font-semibold text-lg">Что-то погасло</h2><p className="text-sm text-mute mt-2 mb-5">Ошибка не затронула ваши данные.</p><Btn v="p" onClick={()=>{this.setState({err:null});location.hash='#/';}}><Ic n="refresh" s={15}/>Перезапустить</Btn></div></div>;return this.props.children;}}
function App(){const[route,setRoute]=useState(parseRoute());const[session,setSession]=useState<any>(null);const[ready,setReady]=useState(false);const[f,setFState]=useState<Filters>({...DEF_F});const[toasts,setToasts]=useState<any[]>([]);const[matchQ,setMatchQ]=useState<any[]>([]);const[reportPid,setReportPid]=useState<string|null>(null);const[blockPid,setBlockPid]=useState<string|null>(null);const[typing,setTyping]=useState<any>({});const[soundOn,setSoundOn]=useState(true);const[,force]=useReducer((x:number)=>x+1,0);const lastAction=useRef<any>(null);const prefTimer=useRef<any>(null);const matchTimers=useRef<any[]>([]);
const nav=useCallback((p:string)=>{location.hash=p;},[]);
const toast=useCallback((msg:string,type='info',action?:any)=>{const id=uid();setToasts(t=>[...t.slice(-3),{id,msg,type,action}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),4600);},[]);
const refreshSession=useCallback(async()=>{const s=await DB.getSession();setSession(s);if(s){if(DB.mode==='supabase'){await DB.refreshProfiles();await DB.syncSocial();}setFState({...DEF_F,...DB.prefs()});const me=DB.me();Sound.on=me?.notify?.sound!==false;setSoundOn(Sound.on);}else setFState({...DEF_F});force();return s;},[]);
useEffect(()=>{(async()=>{try{await DB.ready();}catch(e:any){toast('Supabase недоступен — включён демо-режим.','danger');store.del('iskra_sb');DB=new LocalDriver();}await refreshSession();setReady(true);})();},[]);
useEffect(()=>{const h=()=>{const r=parseRoute();setRoute(r);if(r.view!=='messages')window.scrollTo(0,0);};window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h);},[]);
useEffect(()=>DB.sub(force),[]);
useEffect(()=>{const un=DB.on((type:string,d:any)=>{const me=DB.me();
if(type==='match'){setMatchQ(q=>[...q,d]);if(me?.notify?.matches!==false)Sound.match();
const t=setTimeout(()=>{if(DB.me()&&DB.matchWith&&d.other){const mid=d.match.id;const op=d.other.opener||('Привет! Рада совпадению ✨ Расскажи, что тебя сегодня порадовало?');DB.agentSay(mid,d.other.id,op,false);}},3500);matchTimers.current.push(t);}
if(type==='message'){const ar=parseRoute();const open=ar.view==='messages'&&ar.chatId===d.mid;if(open){DB.markRead(d.mid);}else if(me?.notify?.messages!==false){Sound.msg();toast('Новое сообщение'+(d.other?' от '+d.other.name:''),'message');}}
if(type==='like'){if(me?.notify?.likes!==false){Sound.fav();toast(d.other.name+' отправила вам симпатию ✦','info',{label:'Посмотреть',fn:()=>nav('/matches')});}}
if(type==='typing')setTyping((t:any)=>({...t,[d.mid]:d.on}));});
const wake=()=>Sound.ensure();document.addEventListener('pointerdown',wake);
return()=>{un();document.removeEventListener('pointerdown',wake);matchTimers.current.forEach(t=>clearTimeout(t));matchTimers.current=[];};},[session?.id]);
useEffect(()=>{if(session&&DB.mode==='demo')DB.ambient();},[session?.id]);
useEffect(()=>{setTyping({});setMatchQ([]);},[session?.id]);
const setF=useCallback((patch:any)=>{setFState(prev=>{const next={...prev,...patch};if(prefTimer.current)clearTimeout(prefTimer.current);prefTimer.current=setTimeout(()=>DB.savePrefs(next),350);return next;});},[]);
const me=DB.me();
const doLike=useCallback(async(p:Profile)=>{try{Sound.like();const r=await DB.like(p.id);lastAction.current={type:'like',id:p.id,matched:!!r.match};if(!r.match)toast('Симпатия отправлена: '+p.name,'success',{label:'Отменить',fn:async()=>{try{await DB.undoLike(p.id);toast('Симпатия отменена','info');}catch(e:any){toast(e.message,'danger');}}});}catch(e:any){toast(e.message,'danger');}},[]);
const doPass=useCallback(async(p:Profile)=>{Sound.nope();await DB.pass(p.id);lastAction.current={type:'pass',id:p.id};toast('Пропущено: '+p.name,'info',{label:'Вернуть',fn:async()=>{await DB.undoPass(p.id);toast('Анкета возвращена','success');}});},[]);
const doFav=useCallback(async(p:Profile)=>{const added=await DB.toggleFav(p.id);Sound.fav();toast(added?p.name+' — в избранном ★':'Убрано из избранного',added?'success':'info');},[]);
const undoLast=useCallback(async()=>{const a=lastAction.current;if(!a)return toast('Нечего возвращать','info');try{if(a.type==='like'){if(a.matched)return toast('Совпадение уже создано — отменить нельзя','danger');await DB.undoLike(a.id);toast('Симпатия отменена','success');}else{await DB.undoPass(a.id);toast('Анкета возвращена','success');}lastAction.current=null;}catch(e:any){toast(e.message,'danger');}},[]);
const logout=useCallback(async()=>{await DB.signOut();await refreshSession();nav('/');toast('Вы вышли. До встречи ✦','info');},[]);
const demoLogin=useCallback(async()=>{if(DB.mode!=='demo'){store.del('iskra_sb');DB=new LocalDriver();await DB.ready();}await DB.demoLogin();await refreshSession();toast('Демо-аккаунт открыт — AI-агенты уже в чатах ✦','success');},[]);
const toggleSound=useCallback(()=>{setSoundOn(s=>{const n=!s;Sound.on=n;if(DB.me())DB.updateProfile({notify:{...DB.me().notify,sound:n}});if(n)Sound.fav();return n;});},[]);
if(!ready)return <div className="splash"><svg width="54" height="54" viewBox="0 0 24 24"><path fill="#FF5C8A" d="M12 1l2.4 7.2L22 12l-7.6 3.8L12 23l-2.4-7.2L2 12l7.6-3.8z"/></svg><div className="font-disp tracking-[.35em] font-bold">ИСКРА</div><div className="text-mute text-sm">подключаем данные…</div></div>;
const guarded=['discover','filters','profile','matches','messages','settings'];
const r=(!session&&guarded.includes(route.view))?{view:'auth',mode:'login'}:route;
const ctx={me,session,f,setF,nav,route:r,toast,doLike,doPass,doFav,undoLast,logout,demoLogin,refreshSession,typing,soundOn,toggleSound,api:DB,report:(id:string)=>setReportPid(id),blockAsk:(id:string)=>setBlockPid(id)};
let content:any=null;
if(r.view==='landing')content=<Landing/>;else if(r.view==='auth')content=<Auth mode={r.mode}/>;else{const inner=r.view==='discover'?<Discover/>:r.view==='filters'?<FiltersPage/>:r.view==='profile'?<ProfilePage id={r.id}/>:r.view==='matches'?<MatchesPage/>:r.view==='messages'?<MessagesPage chatId={r.chatId}/>:r.view==='settings'?<SettingsPage tab={r.tab}/>:<DeployPage/>;content=<Shell route={r}>{inner}</Shell>;}
const tIcon:any={success:['check','#3ECF8E'],danger:['alert','#FF4D5E'],info:['info','#6EA8FF'],message:['chat','#8B5CF6']};
return <Ctx.Provider value={ctx}>{content}
<AnimatePresence>{matchQ.length>0&&<MatchOverlay key={matchQ[0].match.id} data={matchQ[0]} onClose={()=>setMatchQ(q=>q.slice(1))}/>}</AnimatePresence>
{reportPid&&<ReportModal pid={reportPid} onClose={()=>setReportPid(null)}/>}
{blockPid&&<BlockModal pid={blockPid} onClose={()=>setBlockPid(null)}/>}
<div className="fixed z-[95] bottom-24 lg:bottom-6 right-4 left-4 sm:left-auto sm:w-[340px] space-y-2.5 pointer-events-none">{toasts.map(t=><div key={t.id} className="toast pointer-events-auto glass-deep rounded-2xl p-3.5 shadow-card overflow-hidden"><div className="flex items-start gap-3"><span className="w-8 h-8 rounded-xl flex-none flex items-center justify-center" style={{background:(tIcon[t.type]?.[1]||'#6EA8FF')+'22',color:tIcon[t.type]?.[1]||'#6EA8FF'}}><Ic n={tIcon[t.type]?.[0]||'info'} s={15}/></span><span className="text-[13px] text-snow leading-snug flex-1 pt-1">{t.msg}</span>{t.action&&<button className="text-xs font-bold text-rose hover:underline flex-none pt-1.5" onClick={()=>{t.action.fn();setToasts(x=>x.filter(y=>y.id!==t.id));}}>{t.action.label}</button>}</div><div className="toast-bar mt-2.5"/></div>)}</div></Ctx.Provider>;}
ReactDOM.createRoot(document.getElementById('root')!).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
